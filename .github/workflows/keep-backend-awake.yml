# Keeps the Render free-tier backend from sleeping.
#
# Render spins a free web service down after ~15 minutes without traffic, and
# the next visitor then waits 20–60 s while it wakes. Pinging the health
# endpoint every 10 minutes keeps it warm, so the site starts immediately.
#
# Notes
# - Free for public repositories. GitHub may delay scheduled runs by a few
#   minutes under load; 10 minutes leaves room inside Render's 15-minute window.
# - GitHub pauses scheduled workflows after 60 days with no commits to the
#   repo; re-enable it from the Actions tab if that happens.
# - One always-on free service uses ~744 of Render's 750 free hours a month.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://embs-website-b3de.onrender.com/api/health) && echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend did not answer with 200"; exit 1

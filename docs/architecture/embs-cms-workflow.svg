<path d="M327,168 h184 a3,3 0 0 1 3,3 v29 h-190 v-29 a3,3 0 0 1 3,-3 z" fill="#1F3A5F"/>
<text x="336" y="189" font-size="12" font-weight="bold" fill="#9DB7D5" text-anchor="start">2</text>
<text x="352" y="189" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">BACKEND API &amp; AUTH</text>
<text x="336" y="218" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">TECHNOLOGY</text>
<text x="336" y="232" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">Node.js + Express.js</text>
<text x="336" y="254" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">AUTHENTICATION</text>
<text x="336" y="268" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">JWT</text>
<text x="336" y="283" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Roles: admin, editor</text>
<text x="336" y="303.5" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">PURPOSE</text>
<text x="336" y="316.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">REST API (/api/...) receives</text>
<text x="336" y="330.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">requests and runs content</text>
<text x="336" y="343.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">operations.</text>
<text x="336" y="364.0" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="346" y="364.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Create / edit / delete: JWT</text>
<text x="346" y="377.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">+ role check required</text>
<text x="336" y="391.0" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="346" y="391.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Read (GET) routes: public</text>
<rect x="608" y="168" width="190" height="252" rx="3" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="1.3"/>
<path d="M611,168 h184 a3,3 0 0 1 3,3 v29 h-190 v-29 a3,3 0 0 1 3,-3 z" fill="#1F3A5F"/>
<text x="620" y="189" font-size="12" font-weight="bold" fill="#9DB7D5" text-anchor="start">3</text>
<text x="636" y="189" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">DATABASE</text>
<text x="620" y="218" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">TECHNOLOGY</text>
<text x="620" y="232" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">MongoDB Atlas</text>
<text x="620" y="248" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">+ Mongoose</text>
<text x="620" y="270" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">PURPOSE</text>
<text x="620" y="283" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Stores website content as</text>
<text x="620" y="296.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">documents, one Mongoose</text>
<text x="620" y="310.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">model per content type.</text>
<text x="620" y="330.5" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">PUBLISHING STATUS</text>
<text x="620" y="343.5" font-size="10.5" font-weight="bold" fill="#4E7D5B" text-anchor="start">published: true / false</text>
<text x="630" y="357.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">on events, blogs, podcasts</text>
<text x="630" y="371.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">and gallery items</text>
<text x="620" y="384.5" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="630" y="384.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Also stores image URLs</text>
<rect x="893" y="168" width="190" height="252" rx="3" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="1.3"/>
<path d="M896,168 h184 a3,3 0 0 1 3,3 v29 h-190 v-29 a3,3 0 0 1 3,-3 z" fill="#1F3A5F"/>
<text x="905" y="189" font-size="12" font-weight="bold" fill="#9DB7D5" text-anchor="start">4</text>
<text x="921" y="189" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">PUBLIC WEBSITE</text>
<text x="905" y="218" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">TECHNOLOGY</text>
<text x="905" y="232" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">HTML · CSS · JavaScript</text>
<text x="905" y="254" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">PURPOSE</text>
<text x="905" y="267" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Fetches content through</text>
<text x="905" y="280.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">the API and displays it</text>
<text x="905" y="294.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">to website visitors.</text>
<text x="905" y="314.5" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">BEHAVIOUR</text>
<text x="905" y="327.5" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="915" y="327.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">No login needed</text>
<text x="905" y="341.0" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="915" y="341.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Draft items stay hidden;</text>
<text x="915" y="354.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">only published ones show</text>
<text x="905" y="368.0" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="915" y="368.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Images load from</text>
<text x="915" y="381.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Cloudinary URLs</text>
<polyline points="232,296 321,296" fill="none" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arr-1F3A5F)"/>
<text x="277.0" y="288" font-size="10" font-weight="bold" fill="#1F3A5F" text-anchor="middle">API Request</text>
<text x="277.0" y="311" font-size="9" font-weight="normal" fill="#5F6B76" text-anchor="middle" font-style="italic">HTTPS + JWT</text>
<polyline points="516,296 605,296" fill="none" stroke="#1F3A5F" stroke-width="1.5" marker-end="url(#arr-1F3A5F)"/>
<text x="561.0" y="276" font-size="10" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Database</text>
<text x="561.0" y="288" font-size="10" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Operation</text>
<text x="561.0" y="311" font-size="9" font-weight="normal" fill="#5F6B76" text-anchor="middle" font-style="italic">via Mongoose</text>
<polyline points="800,296 890,296" fill="none" stroke="#4E7D5B" stroke-width="1.5" marker-end="url(#arr-4E7D5B)"/>
<text x="845.5" y="276" font-size="10" font-weight="bold" fill="#4E7D5B" text-anchor="middle">Saved Content /</text>
<text x="845.5" y="288" font-size="10" font-weight="bold" fill="#4E7D5B" text-anchor="middle">API Response</text>
<text x="845.5" y="311" font-size="9" font-weight="normal" fill="#5F6B76" text-anchor="middle" font-style="italic">sent by backend</text>
<polyline points="988.0,167 988.0,134 419.0,134 419.0,165" fill="none" stroke="#4E7D5B" stroke-width="1.3" marker-end="url(#arr-4E7D5B)"/>
<text x="703.5" y="127" font-size="10" font-weight="bold" fill="#4E7D5B" text-anchor="middle">Visitor&#x27;s page requests content:  GET /api/events, /api/blogs, ...   (no login)</text>
<rect x="598" y="446" width="210" height="76" rx="3" fill="#F2F4F6" stroke="#5F6B76" stroke-width="1.2"/>
<text x="610" y="465" font-size="10.5" font-weight="bold" fill="#2C4A72" text-anchor="start">MEDIA STORAGE</text>
<text x="610" y="482" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">Cloudinary</text>
<text x="610" y="498" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">Stores uploaded images and files.</text>
<text x="610" y="512" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">The app saves and uses their URLs.</text>
<polyline points="419.0,421 419.0,484.0 595,484.0" fill="none" stroke="#5F6B76" stroke-width="1.3" stroke-dasharray="2,3" marker-end="url(#arr-5F6B76)"/>
<text x="512.5" y="477.0" font-size="10" font-weight="bold" fill="#2C4A72" text-anchor="middle">Media Upload / URL</text>
<text x="512.5" y="499.0" font-size="9" font-weight="normal" fill="#5F6B76" text-anchor="middle" font-style="italic">Multer, on create / edit</text>
<polyline points="809,484.0 988.0,484.0 988.0,423" fill="none" stroke="#5F6B76" stroke-width="1.3" stroke-dasharray="2,3" marker-end="url(#arr-5F6B76)"/>
<text x="898.0" y="477.0" font-size="10" font-weight="bold" fill="#2C4A72" text-anchor="middle">Image URL</text>
<text x="898.0" y="499.0" font-size="9" font-weight="normal" fill="#5F6B76" text-anchor="middle" font-style="italic">loaded by the browser</text>
<text x="40" y="476" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">HOSTING</text>
<text x="40" y="491" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">Frontend (public site + admin): Vercel</text>
<text x="40" y="505" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">Backend API: Render</text>
<line x1="40" y1="571" x2="1083" y2="571" stroke="#B8C2CC" stroke-width="1" stroke-dasharray="4,3"/>
<text x="40" y="591" font-size="11.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">EXAMPLE: PUBLISHING A WEBSITE EVENT</text>
<rect x="40.0" y="607" width="236" height="80" rx="3" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1.1"/>
<text x="50.0" y="625" font-size="10.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">1.  Admin enters event details</text>
<text x="50.0" y="642" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">Fills title, date, venue and</text>
<text x="50.0" y="655" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">thumbnail; chooses Draft or</text>
<text x="50.0" y="668" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">Published.</text>
<polyline points="279.0,647.0 305.0,647.0" fill="none" stroke="#1F3A5F" stroke-width="1.2" marker-end="url(#arr-1F3A5F)"/>
<rect x="309.0" y="607" width="236" height="80" rx="3" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1.1"/>
<text x="319.0" y="625" font-size="10.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">2.  Backend API processes it</text>
<text x="319.0" y="642" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">POST /api/events: JWT + role</text>
<text x="319.0" y="655" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">checked, thumbnail uploaded</text>
<text x="319.0" y="668" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">to Cloudinary.</text>
<polyline points="548.0,647.0 574.0,647.0" fill="none" stroke="#1F3A5F" stroke-width="1.2" marker-end="url(#arr-1F3A5F)"/>
<rect x="578.0" y="607" width="236" height="80" rx="3" fill="#FFFFFF" stroke="#B8C2CC" stroke-width="1.1"/>
<text x="588.0" y="625" font-size="10.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">3.  Event saved in MongoDB</text>
<text x="588.0" y="642" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">Event document stored with</text>
<text x="588.0" y="655" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">published: true/false and</text>
<text x="588.0" y="668" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">the image URL.</text>
<polyline points="817.0,647.0 843.0,647.0" fill="none" stroke="#1F3A5F" stroke-width="1.2" marker-end="url(#arr-1F3A5F)"/>
<rect x="847.0" y="607" width="236" height="80" rx="3" fill="#EEF5EF" stroke="#4E7D5B" stroke-width="1.1"/>
<text x="857.0" y="625" font-size="10.5" font-weight="bold" fill="#4E7D5B" text-anchor="start">4.  Events page displays it</text>
<text x="857.0" y="642" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">GET /api/events returns only</text>
<text x="857.0" y="655" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">published events; the page</text>
<text x="857.0" y="668" font-size="10" font-weight="normal" fill="#2B2F33" text-anchor="start">shows them to visitors.</text>
<text x="40" y="707" font-size="9.5" font-weight="normal" fill="#5F6B76" text-anchor="start" font-style="italic">If saved as a Draft (published: false), the event stays visible only in the admin panel. There is no separate approval stage.</text>
<line x1="40" y1="744" x2="1083" y2="744" stroke="#B8C2CC" stroke-width="1"/>
<text x="561.5" y="760" font-size="11" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Admin Panel  →  Backend API  →  Database  →  Public Website</text>
<text x="1083" y="760" font-size="9" font-weight="normal" fill="#5F6B76" text-anchor="end">K. Josephine Mary Carain</text></svg>
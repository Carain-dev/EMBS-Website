<text x="52" y="189" font-size="12" font-weight="bold" fill="#9DB7D5" text-anchor="start">1</text>
<text x="68" y="189" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">ADMIN PANEL</text>
<text x="52" y="218" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">TECHNOLOGY</text>
<text x="52" y="232" font-size="12.5" font-weight="bold" fill="#1F3A5F" text-anchor="start">HTML · CSS · JavaScript</text>
<text x="52" y="254" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">PURPOSE</text>
<text x="52" y="267" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Admin / editor logs in to</text>
<text x="52" y="280.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">create, edit and delete</text>
<text x="52" y="294.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">website content.</text>
<text x="52" y="314.5" font-size="8.5" font-weight="bold" fill="#5F6B76" text-anchor="start" letter-spacing="0.6">MANAGES</text>
<text x="52" y="327.5" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="62" y="327.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Events · Achievements</text>
<text x="52" y="341.0" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="62" y="341.0" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Blogs · Podcast episodes</text>
<text x="52" y="354.5" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
<text x="62" y="354.5" font-size="10.5" font-weight="normal" fill="#2B2F33" text-anchor="start">Gallery · Members</text>
<text x="52" y="368.0" font-size="10.5" font-weight="normal" fill="#1F3A5F" text-anchor="start">•</text>
